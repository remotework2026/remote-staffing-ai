<!DOCTYPE html>
<html>
<head>
  <title>Remote Staff Dashboard</title>

  <style>
    body{
      font-family:Arial;
      background:#020617;
      color:white;
      padding:20px;
    }

    h1{
      color:#38bdf8;
    }

    button{
      background:#38bdf8;
      color:#020617;
      border:none;
      padding:12px 18px;
      border-radius:8px;
      margin:5px;
      cursor:pointer;
      font-weight:bold;
    }

    .section{
      background:#111827;
      border:1px solid #1e293b;
      padding:25px;
      border-radius:18px;
      margin-bottom:25px;
    }

    textarea,input{
      width:100%;
      max-width:600px;
      padding:12px;
      border-radius:8px;
      border:1px solid #334155;
      background:#020617;
      color:white;
      margin-top:10px;
    }
  </style>
</head>

<body>

<h1>🚀 Remote Staff Dashboard</h1>

<div class="section">

  <button onclick="window.location.href='/landing.html'">
    Home
  </button>

  <button onclick="viewClients()">
    View Clients
  </button>

  <button onclick="viewApplicants()">
    View Applicants
  </button>

  <button onclick="findMatches()">
    Match Clients + Applicants
  </button>

  <button onclick="viewEmails()">
    View Email History
  </button>

  <button onclick="runAutoEmails()">
    Run Auto Emails
  </button>

  <button onclick="runTestFollowups()">
    Test Follow-Ups
  </button>

  <button onclick="logout()">
    Logout
  </button>

</div>

<div class="section">

  <h2>Import Clients CSV</h2>

  <textarea id="csv_clients" rows="8"></textarea>

  <br>

  <button onclick="importClientsCSV()">
    Import CSV
  </button>

</div>

<script>

const API = "";

function openPopup(title, html){

  const win = window.open("", "_blank", "width=900,height=700");

  win.document.write(`
    <html>
    <head>
      <title>${title}</title>

      <style>
        body{
          font-family:Arial;
          background:#020617;
          color:white;
          padding:20px;
        }

        .card{
          background:#111827;
          border:1px solid #1e293b;
          padding:20px;
          border-radius:12px;
          margin-bottom:15px;
        }
      </style>
    </head>

    <body>
      ${html}
    </body>
    </html>
  `);

  win.document.close();
}

function viewClients(){

  fetch(API + "/clients")
  .then(res=>res.json())
  .then(data=>{

    let html = "<h2>Clients</h2>";

    data.forEach(c=>{

      html += `
        <div class="card">
          <b>${c.name}</b><br>
          Role: ${c.role || "N/A"}<br>
          Email: ${c.email || "N/A"}<br>
          Status: ${c.status || "New"}
        </div>
      `;
    });

    openPopup("Clients", html);
  });
}

function viewApplicants(){

  fetch(API + "/applicants")
  .then(res=>res.json())
  .then(data=>{

    let html = "<h2>Applicants</h2>";

    data.forEach(a=>{

      html += `
        <div class="card">
          <b>${a.name}</b><br>
          Role: ${a.role || "N/A"}<br>
          Email: ${a.email || "N/A"}<br>
          English: ${a.english || "N/A"}<br>
          Internet: ${a.internet || "N/A"}<br>
          Score: ${a.score || 0}
        </div>
      `;
    });

    openPopup("Applicants", html);
  });
}

function findMatches(){

  fetch(API + "/match")
  .then(res=>res.json())
  .then(data=>{

    let html = "<h2>Client + Applicant Matches</h2>";

    data.forEach(m=>{

      html += `
        <div class="card">

          <b>Client:</b> ${m.client.name}<br>
          Needed Role: ${m.client.role || "N/A"}<br><br>

          ${
            m.best
            ? `
              <b>Best Applicant:</b> ${m.best.name}<br>
              Role: ${m.best.role || "N/A"}<br>
              Email: ${m.best.email || "N/A"}<br>
              Score: ${m.best.score || 0}
            `
            : "No matching applicant found"
          }

        </div>
      `;
    });

    openPopup("Matches", html);
  });
}

function viewEmails(){

  fetch(API + "/emails")
  .then(res=>res.json())
  .then(data=>{

    let html = "<h2>Email History</h2>";

    data.forEach(e=>{

      html += `
        <div class="card">
          <b>${e.type || "Email"}</b><br>
          To: ${e.to || "N/A"}<br>
          Subject: ${e.subject || "N/A"}
        </div>
      `;
    });

    openPopup("Emails", html);
  });
}

function runAutoEmails(){

  fetch(API + "/run-auto-emails", {
    method:"POST"
  })
  .then(res=>res.json())
  .then(data=>{
    alert(data.message + " | Sent: " + data.sent);
  });
}

function runTestFollowups(){

  fetch(API + "/test-followups", {
    method:"POST"
  })
  .then(res=>res.json())
  .then(data=>{
    alert(data.message + " | Sent: " + data.sent);
  });
}

function importClientsCSV(){

  fetch(API + "/import-clients-csv", {
    method:"POST",
    headers:{
      "Content-Type":"application/json"
    },
    body:JSON.stringify({
      csv:document.getElementById("csv_clients").value
    })
  })
  .then(res=>res.json())
  .then(data=>{
    alert(data.message + " | Imported: " + data.imported);
  });
}

function logout(){

  fetch(API + "/logout", {
    method:"POST"
  })
  .then(()=>{
    window.location.href = "/login";
  });
}

</script>

</body>
</html>
