<!DOCTYPE html>
<html>
<head>
  <title>Remote Staffing AI</title>
</head>
<body>
  <h1>🚀 Remote Staffing Dashboard</h1>

  <h2>Add Applicant</h2>
  <input id="a_name" placeholder="Name"><br>
  <input id="a_role" placeholder="Role e.g. VA"><br>
  <select id="a_internet">
    <option value="good">Good Internet</option>
    <option value="bad">Bad Internet</option>
  </select><br>
  <select id="a_english">
    <option value="good">Good English</option>
    <option value="bad">Bad English</option>
  </select><br>
  <button onclick="addApplicant()">Add Applicant</button>

  <h2>Add Client</h2>
  <input id="c_name" placeholder="Client Name"><br>
  <input id="c_role" placeholder="Needed Role"><br>
  <input id="c_email" placeholder="Client Email"><br>
  <button onclick="addClient()">Add Client</button>

  <hr>

  <h2>CRM</h2>
  <button onclick="autoClients()">Auto Find Clients</button>
  <button onclick="viewApplicants()">View Applicants</button>
  <button onclick="viewClients()">View Clients</button>
  <button onclick="getMatch()">Find Matches</button>
  <button onclick="viewEmails()">View Email History</button>
  <button onclick="runAutoEmails()">Run Auto Emails</button>

  <hr>

  <h2>📥 Import Clients CSV</h2>
  <p>Format: name,role,email</p>
  <textarea id="csv_clients" rows="8" cols="60" placeholder="name,role,email&#10;ABC Store,VA,abc@gmail.com"></textarea><br>
  <button onclick="importClientsCSV()">Import CSV Clients</button>

  <hr>

  <h2>📩 Send Email</h2>
  <input id="email_to" placeholder="Client Email"><br>
  <input id="email_client_name" placeholder="Client Name"><br>
  <input id="email_role" placeholder="Role e.g. VA"><br>
  <input id="email_subject" placeholder="Subject"><br>
  <textarea id="email_text" rows="6" cols="50"></textarea><br>

  <button onclick="generateMessage()">Generate AI Message</button>
  <button onclick="sendEmail()">Send First Email</button>
  <button onclick="sendFollowUp()">Send Follow-Up</button>

  <script>
    const API = "";

    function safeText(value) {
      return String(value || "").replace(/'/g, "\\'");
    }

    function openPopup(title, html) {
      const win = window.open("", "_blank", "width=750,height=700");

      if (!win) {
        alert("Popup blocked. Please allow popups.");
        return;
      }

      win.document.write(`
        <html>
        <head>
          <title>${title}</title>
          <style>
            body { font-family: Arial; padding: 20px; background:#f5f5f5; }
            .card { background:white; padding:15px; margin:10px; border-radius:8px; border:1px solid #ddd; cursor:pointer; }
            .card:hover { background:#eef6ff; }
          </style>
        </head>
        <body>${html}</body>
        </html>
      `);

      win.document.close();
    }

    function selectClient(name, email, role) {
      document.getElementById("email_client_name").value = name || "";
      document.getElementById("email_to").value = email || "";
      document.getElementById("email_role").value = role || "";
      alert("Client loaded: " + name);
    }

    function addApplicant() {
      fetch(API + "/add-applicant", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          name: document.getElementById("a_name").value,
          role: document.getElementById("a_role").value,
          internet: document.getElementById("a_internet").value,
          english: document.getElementById("a_english").value,
          experience: "yes",
          tools: "yes",
          available: "yes"
        })
      })
      .then(res => res.json())
      .then(data => alert("Applicant Added! Score: " + data.score))
      .catch(err => alert("Error: " + err));
    }

    function addClient() {
      fetch(API + "/add-client", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          name: document.getElementById("c_name").value,
          role: document.getElementById("c_role").value,
          email: document.getElementById("c_email").value
        })
      })
      .then(res => res.json())
      .then(() => alert("Client Added!"))
      .catch(err => alert("Error: " + err));
    }

    function autoClients() {
      fetch(API + "/auto-clients")
      .then(res => res.json())
      .then(data => {
        alert(data.message + " (" + data.count + ")");
        viewClients();
      })
      .catch(err => alert("Error: " + err));
    }

    function importClientsCSV() {
      fetch(API + "/import-clients-csv", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          csv: document.getElementById("csv_clients").value
        })
      })
      .then(res => res.json())
      .then(data => {
        alert(data.message + " | Imported: " + data.imported);
        viewClients();
      })
      .catch(err => alert("CSV Import Error: " + err));
    }

    function viewClients() {
      fetch(API + "/clients")
      .then(res => res.json())
      .then(data => {
        let html = "<h2>Clients</h2><p>Click to load into email form</p>";

        if (data.length === 0) html += "<p>No clients saved yet.</p>";

        data.forEach(c => {
          const name = safeText(c.name);
          const email = safeText(c.email);
          const role = safeText(c.role);

          html += `
            <div class="card" onclick="window.opener.selectClient('${name}','${email}','${role}')">
              <b>${c.name}</b><br>
              Email: ${c.email || "N/A"}<br>
              Role: ${c.role || "N/A"}<br>
              Status: ${c.status || "New"}<br>
              Follow-up: ${c.followUpStage || 0}
            </div>
          `;
        });

        openPopup("Clients", html);
      })
      .catch(err => alert("Error: " + err));
    }

    function viewApplicants() {
      fetch(API + "/applicants")
      .then(res => res.json())
      .then(data => {
        let html = "<h2>Applicants</h2>";

        if (data.length === 0) html += "<p>No applicants saved yet.</p>";

        data.forEach(a => {
          html += `
            <div class="card">
              <b>${a.name}</b><br>
              Role: ${a.role}<br>
              Score: ${a.score}/100
            </div>
          `;
        });

        openPopup("Applicants", html);
      })
      .catch(err => alert("Error: " + err));
    }

    function getMatch() {
      fetch(API + "/match")
      .then(res => res.json())
      .then(data => {
        let html = "<h2>Matches</h2>";

        if (data.length === 0) html += "<p>No matches found yet.</p>";

        data.forEach(m => {
          html += `
            <div class="card">
              <b>Client:</b> ${m.client.name}<br>
              Needed: ${m.client.role}<br>
              Match: ${m.best ? m.best.name + " | Score: " + m.best.score : "No match"}
            </div>
          `;
        });

        openPopup("Matches", html);
      })
      .catch(err => alert("Error: " + err));
    }

    function viewEmails() {
      fetch(API + "/emails")
      .then(res => res.json())
      .then(data => {
        let html = "<h2>Email History</h2>";

        if (data.length === 0) html += "<p>No email history yet.</p>";

        data.forEach(e => {
          html += `
            <div class="card">
              <b>${e.type || "Email"}</b><br>
              Client: ${e.clientName || "N/A"}<br>
              To: ${e.to || "N/A"}<br>
              Subject: ${e.subject || "N/A"}<br>
              Sent: ${e.sentAt ? new Date(e.sentAt).toLocaleString() : "N/A"}
            </div>
          `;
        });

        openPopup("Emails", html);
      })
      .catch(err => alert("Error: " + err));
    }

    function generateMessage() {
      fetch(API + "/generate-message", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          clientName: document.getElementById("email_client_name").value || "there",
          role: document.getElementById("email_role").value || "VA"
        })
      })
      .then(res => res.json())
      .then(data => {
        document.getElementById("email_text").value = data.message;
        document.getElementById("email_subject").value = "Remote staffing support";
      })
      .catch(err => alert("Error: " + err));
    }

    function sendEmail() {
      fetch(API + "/send-email", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          to: document.getElementById("email_to").value,
          clientName: document.getElementById("email_client_name").value,
          subject: document.getElementById("email_subject").value,
          text: document.getElementById("email_text").value
        })
      })
      .then(res => res.json())
      .then(data => alert(JSON.stringify(data)))
      .catch(err => alert("Error: " + err));
    }

    function sendFollowUp() {
      fetch(API + "/send-followup", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          to: document.getElementById("email_to").value,
          clientName: document.getElementById("email_client_name").value,
          role: document.getElementById("email_role").value || "VA"
        })
      })
      .then(res => res.json())
      .then(data => alert(JSON.stringify(data)))
      .catch(err => alert("Error: " + err));
    }

    function runAutoEmails() {
      fetch(API + "/run-auto-emails", {
        method: "POST"
      })
      .then(res => res.json())
      .then(data => {
        alert((data.message || "Done") + " | Sent: " + (data.sent || 0) + (data.error ? " | Error: " + data.error : ""));
        viewEmails();
      })
      .catch(err => alert("Auto Email Error: " + err));
    }
  </script>
</body>
</html>
