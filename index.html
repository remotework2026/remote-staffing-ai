<!DOCTYPE html>
<html>
<head>
  <title>Remote Staff Dashboard</title>

  <style>
    body{
      font-family:Arial;
      background:#020617;
      color:white;
      padding:20px;
    }

    h1,h2{
      color:#38bdf8;
    }

    button{
      background:#38bdf8;
      color:#020617;
      border:none;
      padding:12px 18px;
      border-radius:8px;
      margin:5px;
      cursor:pointer;
      font-weight:bold;
    }

    button:hover{
      opacity:.9;
    }

    .section{
      background:#111827;
      border:1px solid #1e293b;
      padding:25px;
      border-radius:18px;
      margin-bottom:25px;
    }

    textarea,input{
      width:100%;
      max-width:600px;
      padding:12px;
      border-radius:8px;
      border:1px solid #334155;
      background:#020617;
      color:white;
      margin-top:10px;
    }

    textarea{
      height:150px;
    }
  </style>
</head>

<body>

<h1>🚀 Remote Staff Dashboard</h1>

<div class="section">

  <button onclick="window.location.href='/landing.html'">Home</button>
  <button onclick="viewClients()">View Clients</button>
  <button onclick="viewApplicants()">View Applicants</button>
  <button onclick="findMatches()">Match Clients + Applicants</button>
  <button onclick="runMatchNotifications()">Run Match Notifications</button>
  <button onclick="viewMatchHistory()">View Match History</button>
  <button onclick="viewEmails()">View Email History</button>
  <button onclick="runAutoEmails()">Run Auto Emails</button>
  <button onclick="runTestFollowups()">Test Follow-Ups</button>
  <button onclick="logout()">Logout</button>

</div>

<div class="section">

  <h2>Import Clients CSV</h2>

  <p>Format:</p>
  <pre>name,role,email
ABC Store,Virtual Assistant,abc@gmail.com</pre>

  <textarea id="csv_clients"></textarea>

  <br>

  <button onclick="importClientsCSV()">Import CSV</button>

</div>

<script>
const API = "";

function openPopup(title, html){

  const win = window.open("", "_blank", "width=950,height=750");

  if(!win){
    alert("Popup blocked. Please allow popups for this site.");
    return;
  }

  win.document.write(`
    <html>
    <head>
      <title>${title}</title>

      <style>
        body{
          font-family:Arial;
          background:#020617;
          color:white;
          padding:20px;
        }

        h2,h3{
          color:#38bdf8;
        }

        .card{
          background:#111827;
          border:1px solid #1e293b;
          padding:20px;
          border-radius:12px;
          margin-bottom:15px;
          line-height:1.6;
        }

        .tag{
          display:inline-block;
          background:#1e293b;
          padding:5px 10px;
          border-radius:6px;
          margin-top:6px;
          margin-right:5px;
        }
      </style>
    </head>

    <body>
      ${html}
    </body>
    </html>
  `);

  win.document.close();
}

function viewClients(){

  fetch(API + "/clients", {
    credentials:"include"
  })
  .then(async res=>{
    if(!res.ok) throw new Error("Failed to load clients");
    return res.json();
  })
  .then(data=>{

    let html = "<h2>Clients</h2>";

    if(data.length === 0){
      html += "<p>No clients found.</p>";
    }

    data.forEach(c=>{

      html += `
        <div class="card">
          <b>${c.name || "N/A"}</b><br><br>

          <b>Contact Name:</b> ${c.contactName || "N/A"}<br>
          <b>Needed Role:</b> ${c.role || "N/A"}<br>
          <b>Email:</b> ${c.email || "N/A"}<br>
          <b>Phone:</b> ${c.phone || "N/A"}<br>
          <b>Source:</b> ${c.source || "N/A"}<br><br>

          <span class="tag">Status: ${c.status || "New"}</span>
          <span class="tag">Follow-up: ${c.followUpStage || 0}</span>

          ${
            c.message
            ? `<br><br><b>Message:</b><br>${c.message}`
            : ""
          }
        </div>
      `;
    });

    openPopup("Clients", html);
  })
  .catch(err=>{
    alert("Error loading clients. You may need to login again.");
    console.log(err);
  });
}

function viewApplicants(){

  fetch(API + "/applicants", {
    credentials:"include"
  })
  .then(async res=>{

    if(!res.ok){
      throw new Error("Failed to load applicants");
    }

    return res.json();
  })
  .then(data=>{

    let html = "<h2>Applicants</h2>";

    if(data.length === 0){
      html += "<p>No applicants found.</p>";
    }

    data.forEach(a=>{

      html += `
        <div class="card">
          <b>${a.name || "N/A"}</b><br><br>

          <b>Role:</b> ${a.role || "N/A"}<br>
          <b>Email:</b> ${a.email || "N/A"}<br>
          <b>Phone:</b> ${a.phone || "N/A"}<br>
          <b>English:</b> ${a.english || "N/A"}<br>
          <b>Internet:</b> ${a.internet || "N/A"}<br>
          <b>Score:</b> ${a.score || 0}<br>
          <b>Source:</b> ${a.source || "N/A"}<br><br>

          <b>Experience:</b><br>
          ${a.experience || "No experience added"}
        </div>
      `;
    });

    openPopup("Applicants", html);
  })
  .catch(err=>{
    alert("Error loading applicants. You may need to login again.");
    console.log(err);
  });
}

function findMatches(){

  fetch(API + "/match", {
    credentials:"include"
  })
  .then(async res=>{

    if(!res.ok){
      throw new Error("Failed to load matches");
    }

    return res.json();
  })
  .then(data=>{

    let html = "<h2>Client + Applicant Matches</h2>";

    if(data.length === 0){
      html += "<p>No clients found yet.</p>";
    }

    data.forEach(m=>{

      html += `
        <div class="card">

          <h3>Client</h3>

          <b>Name:</b> ${m.client.name || "N/A"}<br>
          <b>Needed Role:</b> ${m.client.role || "N/A"}<br>
          <b>Email:</b> ${m.client.email || "N/A"}<br>
          <b>Status:</b> ${m.client.status || "New"}<br><br>

          <hr style="margin:15px 0;border-color:#334155">

          ${
            m.best
            ? `
              <h3>Best Applicant Match</h3>

              <b>Name:</b> ${m.best.name || "N/A"}<br>
              <b>Role:</b> ${m.best.role || "N/A"}<br>
              <b>Email:</b> ${m.best.email || "N/A"}<br>
              <b>Phone:</b> ${m.best.phone || "N/A"}<br>
              <b>English:</b> ${m.best.english || "N/A"}<br>
              <b>Internet:</b> ${m.best.internet || "N/A"}<br>
              <b>Score:</b> ${m.best.score || 0}<br><br>

              <b>Experience:</b><br>
              ${m.best.experience || "No experience added"}
            `
            : `
              <h3>No Applicant Match Found</h3>
              <p>Tip: Make sure client role and applicant role are similar.</p>
            `
          }

        </div>
      `;
    });

    openPopup("Matches", html);
  })
  .catch(err=>{
    alert("Error loading matches. You may need to login again.");
    console.log(err);
  });
}

function viewMatchHistory(){

  fetch(API + "/matches-history", {
    credentials:"include"
  })
  .then(async res=>{
    if(!res.ok) throw new Error("Failed to load match history");
    return res.json();
  })
  .then(data=>{

    let html = "<h2>Match Notification History</h2>";

    if(data.length === 0){
      html += "<p>No match notifications sent yet.</p>";
    }

    data.forEach(m=>{

      html += `
        <div class="card">
          <b>Client:</b> ${m.clientName || "N/A"}<br>
          <b>Client Email:</b> ${m.clientEmail || "N/A"}<br><br>

          <b>Applicant:</b> ${m.applicantName || "N/A"}<br>
          <b>Applicant Email:</b> ${m.applicantEmail || "N/A"}<br><br>

          <b>Role:</b> ${m.role || "N/A"}<br>
          <b>Applicant Score:</b> ${m.applicantScore || 0}<br>
          <b>Matched At:</b> ${m.matchedAt ? new Date(m.matchedAt).toLocaleString() : "N/A"}
        </div>
      `;
    });

    openPopup("Match History", html);
  })
  .catch(err=>{
    alert("Error loading match history.");
    console.log(err);
  });
}

function runMatchNotifications(){

  fetch(API + "/run-match-notifications", {
    method:"POST",
    credentials:"include"
  })
  .then(res=>res.json())
  .then(data=>{
    alert(
      data.message +
      " | Notifications Sent: " +
      data.notificationsSent +
      " | Skipped: " +
      data.skipped
    );
  })
  .catch(err=>{
    alert("Match notification error");
    console.log(err);
  });
}

function viewEmails(){

  fetch(API + "/emails", {
    credentials:"include"
  })
  .then(async res=>{
    if(!res.ok) throw new Error("Failed to load emails");
    return res.json();
  })
  .then(data=>{

    let html = "<h2>Email History</h2>";

    if(data.length === 0){
      html += "<p>No email history found.</p>";
    }

    data.forEach(e=>{

      html += `
        <div class="card">
          <b>${e.type || "Email"}</b><br><br>

          <b>Client:</b> ${e.clientName || "N/A"}<br>
          <b>To:</b> ${e.to || "N/A"}<br>
          <b>Subject:</b> ${e.subject || "N/A"}<br>
          <b>Sent:</b> ${e.sentAt ? new Date(e.sentAt).toLocaleString() : "N/A"}
        </div>
      `;
    });

    openPopup("Emails", html);
  })
  .catch(err=>{
    alert("Error loading email history. You may need to login again.");
    console.log(err);
  });
}

function runAutoEmails(){

  fetch(API + "/run-auto-emails", {
    method:"POST",
    credentials:"include"
  })
  .then(res=>res.json())
  .then(data=>{
    alert(data.message + " | Sent: " + data.sent);
  })
  .catch(err=>{
    alert("Auto email error.");
    console.log(err);
  });
}

function runTestFollowups(){

  fetch(API + "/test-followups", {
    method:"POST",
    credentials:"include"
  })
  .then(res=>res.json())
  .then(data=>{
    alert(data.message + " | Sent: " + data.sent);
  })
  .catch(err=>{
    alert("Follow-up error.");
    console.log(err);
  });
}

function importClientsCSV(){

  fetch(API + "/import-clients-csv", {
    method:"POST",
    credentials:"include",
    headers:{
      "Content-Type":"application/json"
    },
    body:JSON.stringify({
      csv:document.getElementById("csv_clients").value
    })
  })
  .then(res=>res.json())
  .then(data=>{
    alert(data.message + " | Imported: " + data.imported);
  })
  .catch(err=>{
    alert("CSV import error.");
    console.log(err);
  });
}

function logout(){

  fetch(API + "/logout", {
    method:"POST",
    credentials:"include"
  })
  .then(()=>{
    window.location.href = "/login";
  });
}
</script>

</body>
</html>
