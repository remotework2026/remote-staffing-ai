<!DOCTYPE html>
<html>
<head>
  <title>Remote Staff Dashboard</title>
  <style>
    body{font-family:Arial;background:#020617;color:white;padding:20px}
    h1,h2{color:#38bdf8}
    button{background:#38bdf8;color:#020617;border:none;padding:12px 18px;border-radius:8px;margin:5px;cursor:pointer;font-weight:bold}
    .section{background:#111827;border:1px solid #1e293b;padding:25px;border-radius:18px;margin-bottom:25px}
    textarea,input{width:100%;max-width:650px;padding:12px;border-radius:8px;border:1px solid #334155;background:#020617;color:white;margin-top:10px}
    textarea{height:140px}
  </style>
</head>
<body>

<h1>🚀 Remote Staff Dashboard</h1>

<div class="section">
  <button onclick="window.location.href='/landing.html'">Home</button>
  <button onclick="viewClients()">View Clients</button>
  <button onclick="viewApplicants()">View Applicants</button>
  <button onclick="findMatches()">Match Clients + Applicants</button>
  <button onclick="runMatchNotifications()">Run Match Notifications</button>
  <button onclick="viewMatchHistory()">View Match History</button>
  <button onclick="viewClientLeads()">View Client Leads</button>
  <button onclick="viewApplicantLeads()">View Applicant Leads</button>
  <button onclick="logout()">Logout</button>
</div>

<div class="section">
  <h2>Find Client Leads</h2>
  <input id="lead_niche" placeholder="Niche e.g. ecommerce, real estate, clinic">
  <input id="lead_location" placeholder="Location e.g. California, New York, Manila">
  <button onclick="findClientLeads()">Find Client Leads</button>
</div>

<div class="section">
  <h2>Import Applicant Leads CSV</h2>
  <pre>name,role,email,phone,experience
Juan Dela Cruz,Virtual Assistant,juan@gmail.com,09123456789,2 years VA experience</pre>
  <textarea id="applicant_leads_csv"></textarea>
  <button onclick="importApplicantLeads()">Import Applicant Leads</button>
</div>

<script>
const API = "";

function openPopup(title, html){
  const win = window.open("", "_blank", "width=950,height=750");
  if(!win){ alert("Popup blocked."); return; }

  win.document.write(`
    <html>
    <head>
      <title>${title}</title>
      <style>
        body{font-family:Arial;background:#020617;color:white;padding:20px}
        h2,h3{color:#38bdf8}
        .card{background:#111827;border:1px solid #1e293b;padding:20px;border-radius:12px;margin-bottom:15px;line-height:1.6}
      </style>
    </head>
    <body>${html}</body>
    </html>
  `);
  win.document.close();
}

function viewClients(){
  fetch(API + "/clients", {credentials:"include"})
  .then(res=>res.json())
  .then(data=>{
    let html = "<h2>Clients</h2>";
    if(data.length === 0) html += "<p>No clients found.</p>";
    data.forEach(c=>{
      html += `<div class="card">
        <b>${c.name || "N/A"}</b><br>
        Contact: ${c.contactName || "N/A"}<br>
        Role: ${c.role || "N/A"}<br>
        Email: ${c.email || "N/A"}<br>
        Phone: ${c.phone || "N/A"}<br>
        Status: ${c.status || "New"}<br>
        Source: ${c.source || "N/A"}<br>
        Message: ${c.message || "N/A"}
      </div>`;
    });
    openPopup("Clients", html);
  });
}

function viewApplicants(){
  fetch(API + "/applicants", {credentials:"include"})
  .then(res=>res.json())
  .then(data=>{
    let html = "<h2>Applicants</h2>";
    if(data.length === 0) html += "<p>No applicants found.</p>";
    data.forEach(a=>{
      html += `<div class="card">
        <b>${a.name || "N/A"}</b><br>
        Role: ${a.role || "N/A"}<br>
        Email: ${a.email || "N/A"}<br>
        Phone: ${a.phone || "N/A"}<br>
        English: ${a.english || "N/A"}<br>
        Internet: ${a.internet || "N/A"}<br>
        Score: ${a.score || 0}<br>
        Experience: ${a.experience || "N/A"}
      </div>`;
    });
    openPopup("Applicants", html);
  });
}

function findMatches(){
  fetch(API + "/match", {credentials:"include"})
  .then(res=>res.json())
  .then(data=>{
    let html = "<h2>Client + Applicant Matches</h2>";
    if(data.length === 0) html += "<p>No matches found.</p>";
    data.forEach(m=>{
      html += `<div class="card">
        <h3>Client</h3>
        Name: ${m.client.name || "N/A"}<br>
        Needed Role: ${m.client.role || "N/A"}<br>
        Email: ${m.client.email || "N/A"}<br><hr>
        ${
          m.best
          ? `<h3>Best Applicant</h3>
             Name: ${m.best.name || "N/A"}<br>
             Role: ${m.best.role || "N/A"}<br>
             Email: ${m.best.email || "N/A"}<br>
             Phone: ${m.best.phone || "N/A"}<br>
             Score: ${m.best.score || 0}<br>
             Experience: ${m.best.experience || "N/A"}`
          : `<h3>No Applicant Match Found</h3>`
        }
      </div>`;
    });
    openPopup("Matches", html);
  });
}

function runMatchNotifications(){
  fetch(API + "/run-match-notifications", {method:"POST", credentials:"include"})
  .then(res=>res.json())
  .then(data=>{
    alert(data.message + " | Notifications Sent: " + data.notificationsSent + " | Skipped: " + data.skipped);
  });
}

function viewMatchHistory(){
  fetch(API + "/matches-history", {credentials:"include"})
  .then(res=>res.json())
  .then(data=>{
    let html = "<h2>Match History</h2>";
    if(data.length === 0) html += "<p>No match history yet.</p>";
    data.forEach(m=>{
      html += `<div class="card">
        Client: ${m.clientName || "N/A"}<br>
        Client Email: ${m.clientEmail || "N/A"}<br>
        Applicant: ${m.applicantName || "N/A"}<br>
        Applicant Email: ${m.applicantEmail || "N/A"}<br>
        Role: ${m.role || "N/A"}<br>
        Score: ${m.applicantScore || 0}<br>
        Date: ${m.matchedAt ? new Date(m.matchedAt).toLocaleString() : "N/A"}
      </div>`;
    });
    openPopup("Match History", html);
  });
}

function findClientLeads(){
  fetch(API + "/find-client-leads", {
    method:"POST",
    credentials:"include",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      niche:document.getElementById("lead_niche").value,
      location:document.getElementById("lead_location").value
    })
  })
  .then(res=>res.json())
  .then(data=>alert(data.message + " | Added: " + data.added));
}

function viewClientLeads(){
  fetch(API + "/client-leads", {credentials:"include"})
  .then(res=>res.json())
  .then(data=>{
    let html = "<h2>Client Leads</h2>";
    if(data.length === 0) html += "<p>No client leads yet.</p>";
    data.forEach(l=>{
      html += `<div class="card">
        <b>${l.businessName || "N/A"}</b><br>
        Niche: ${l.niche || "N/A"}<br>
        Location: ${l.location || "N/A"}<br>
        Email: ${l.email || "Not added"}<br>
        Website: ${l.website || "Not added"}<br>
        Status: ${l.status || "New Lead"}
      </div>`;
    });
    openPopup("Client Leads", html);
  });
}

function importApplicantLeads(){
  fetch(API + "/import-applicant-leads", {
    method:"POST",
    credentials:"include",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      csv:document.getElementById("applicant_leads_csv").value
    })
  })
  .then(res=>res.json())
  .then(data=>alert(data.message + " | Imported: " + data.imported));
}

function viewApplicantLeads(){
  fetch(API + "/applicant-leads", {credentials:"include"})
  .then(res=>res.json())
  .then(data=>{
    let html = "<h2>Applicant Leads</h2>";
    if(data.length === 0) html += "<p>No applicant leads yet.</p>";
    data.forEach(a=>{
      html += `<div class="card">
        <b>${a.name || "N/A"}</b><br>
        Role: ${a.role || "N/A"}<br>
        Email: ${a.email || "N/A"}<br>
        Phone: ${a.phone || "N/A"}<br>
        Experience: ${a.experience || "N/A"}<br>
        Status: ${a.status || "New Applicant Lead"}
      </div>`;
    });
    openPopup("Applicant Leads", html);
  });
}

function logout(){
  fetch(API + "/logout", {method:"POST", credentials:"include"})
  .then(()=> window.location.href = "/login");
}
</script>

</body>
</html>
