<!DOCTYPE html>
<html>
<head>
  <title>Remote Staffing AI</title>
</head>
<body>
  <h1>🚀 Remote Staffing Dashboard</h1>

  <h2>Add Applicant</h2>
  <input id="a_name" placeholder="Name"><br>
  <input id="a_role" placeholder="Role e.g. VA"><br>
  <select id="a_internet">
    <option value="good">Good Internet</option>
    <option value="bad">Bad Internet</option>
  </select><br>
  <select id="a_english">
    <option value="good">Good English</option>
    <option value="bad">Bad English</option>
  </select><br>
  <button onclick="addApplicant()">Add Applicant</button>

  <h2>Add Client</h2>
  <input id="c_name" placeholder="Client Name"><br>
  <input id="c_role" placeholder="Needed Role"><br>
  <input id="c_email" placeholder="Client Email"><br>
  <button onclick="addClient()">Add Client</button>

  <hr>

  <h2>CRM</h2>
  <button onclick="autoClients()">Auto Find Clients</button>
  <button onclick="viewApplicants()">View Applicants</button>
  <button onclick="alert('Button works')">View Clients</button>
  <button onclick="getMatch()">Find Matches</button>
  <button onclick="viewEmails()">View Email History</button>

  <hr>

  <h2>📩 Send Email</h2>
  <input id="email_to" placeholder="Client Email"><br>
  <input id="email_client_name" placeholder="Client Name"><br>
  <input id="email_role" placeholder="Role e.g. VA"><br>
  <input id="email_subject" placeholder="Subject"><br>
  <textarea id="email_text" rows="6" cols="50"></textarea><br>

  <button onclick="generateMessage()">Generate AI Message</button>
  <button onclick="sendEmail()">Send First Email</button>
  <button onclick="sendFollowUp()">Send Follow-Up</button>

  <div id="output"></div>

  <script>
    const API = "";

    function openPopup(title, html) {
      const win = window.open("", "_blank", "width=700,height=700");
      win.document.write(`
        <html>
        <head>
          <title>${title}</title>
          <style>
            body { font-family: Arial; padding: 20px; background:#f5f5f5; }
            .card { background:white; padding:15px; margin:10px; border-radius:8px; border:1px solid #ddd; }
          </style>
        </head>
        <body>${html}</body>
        </html>
      `);
      win.document.close();
    }

    function addApplicant() {
      fetch(API + "/add-applicant", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          name: document.getElementById("a_name").value,
          role: document.getElementById("a_role").value,
          internet: document.getElementById("a_internet").value,
          english: document.getElementById("a_english").value,
          experience: "yes",
          tools: "yes",
          available: "yes"
        })
      })
      .then(res => res.json())
      .then(data => alert("Applicant Added! Score: " + data.score));
    }

    function addClient() {
      fetch(API + "/add-client", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          name: document.getElementById("c_name").value,
          role: document.getElementById("c_role").value,
          email: document.getElementById("c_email").value
        })
      })
      .then(res => res.json())
      .then(() => alert("Client Added!"));
    }

    function viewApplicants() {
      fetch(API + "/applicants")
      .then(res => res.json())
      .then(data => {
        let html = "<h2>Applicants</h2>";
        data.forEach(a => {
          html += `<div class="card">
            <b>${a.name}</b><br>
            Role: ${a.role}<br>
            Score: ${a.score}/100
          </div>`;
        });
        openPopup("Applicants", html);
      });
    }

    function viewClients() {
  alert("View Clients clicked");

  fetch(API + "/clients")
  .then(res => res.json())
  .then(data => {
    alert("Clients found: " + data.length);

    let html = "<h2>Clients</h2>";

    data.forEach(c => {
      html += `
        <div class="card">
          <b>${c.name}</b><br>
          Email: ${c.email || "N/A"}<br>
          Role: ${c.role}<br>
          Status: ${c.status || "New"}<br>
          Follow-up: ${c.followUpStage || 0}
        </div>
      `;
    });

    openPopup("Clients", html);
  })
  .catch(err => alert("Error: " + err));
}

    function viewEmails() {
      fetch(API + "/emails")
      .then(res => res.json())
      .then(data => {
        let html = "<h2>Email History</h2>";
        data.forEach(e => {
          html += `<div class="card">
            <b>${e.type}</b><br>
            Client: ${e.clientName}<br>
            To: ${e.to}<br>
            Subject: ${e.subject}
          </div>`;
        });
        openPopup("Emails", html);
      });
    }

    function getMatch() {
      fetch(API + "/match")
      .then(res => res.json())
      .then(data => {
        let html = "<h2>Matches</h2>";
        data.forEach(item => {
          html += `<div class="card">
            <b>${item.client.name}</b><br>
            Needed: ${item.client.role}<br>
            Match: ${item.best ? item.best.name + " (Score " + item.best.score + ")" : "None"}
          </div>`;
        });
        openPopup("Matches", html);
      });
    }

    function generateMessage() {
      fetch(API + "/generate-message", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          clientName: document.getElementById("c_name").value || "there",
          role: document.getElementById("c_role").value || "VA"
        })
      })
      .then(res => res.json())
      .then(data => {
        document.getElementById("email_text").value = data.message;
      });
    }

    function sendEmail() {
      fetch(API + "/send-email", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          to: document.getElementById("email_to").value,
          clientName: document.getElementById("email_client_name").value,
          subject: document.getElementById("email_subject").value,
          text: document.getElementById("email_text").value
        })
      })
      .then(res => res.json())
      .then(data => alert(JSON.stringify(data)));
    }

    function sendFollowUp() {
      fetch(API + "/send-followup", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          to: document.getElementById("email_to").value,
          clientName: document.getElementById("email_client_name").value,
          role: document.getElementById("email_role").value || "VA"
        })
      })
      .then(res => res.json())
      .then(data => alert(JSON.stringify(data)));

   function autoClients() {
  fetch(API + "/auto-clients")
  .then(res => res.json())
  .then(data => {
    alert(data.message + " (" + data.count + ")");

    // 👉 AUTO OPEN CLIENT LIST AFTER
    viewClients();
  })
  .catch(err => alert("Error: " + err));

    }
  </script>
</body>
</html>
